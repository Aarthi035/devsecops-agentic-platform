[defaults]
# Deliberately minimal. Everything the playbooks cannot do without is either
# resolved relative to the playbook or passed on the command line, so a run
# works even where Ansible refuses to read this file at all - it ignores
# ansible.cfg when the directory is world-writable, which is how Windows mounts
# (WSL's /mnt/c, and a Docker Desktop bind mount) present the repository.
#
# In particular the roles live in playbooks/roles/, which Ansible always
# searches next to the playbook, rather than in a roles_path entry here.
#
#   ansible-playbook -i inventory/hosts.ini playbooks/site.yml
#
inventory = inventory/hosts.ini

# The playbooks drive the Kubernetes API; there is no remote machine to gather
# facts from and nothing to inspect over SSH.
gathering = explicit

# No .retry files: a failed run is re-run from the top, and the file would only
# clutter a mounted working directory.
retry_files_enabled = False

# Readable, aligned output when running by hand.
stdout_callback = yaml

# Temp files go to the container's /tmp rather than into the mounted
# repository, so a run never leaves scratch files behind in the working tree.
local_tmp = /tmp/ansible-local

[ssh_connection]
# Irrelevant for the local connection the playbooks use, but harmless and it
# speeds up anything added later.
pipelining = True

