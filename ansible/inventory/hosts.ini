# The playbooks drive the Kubernetes API from the control node, so there is no
# remote machine to connect to and no SSH credentials to hold: the "cluster"
# group is a single implicit localhost.
#
# "localhost" means whatever machine runs ansible-playbook. Here that is the
# control-node container joined to the kind network (see ../Dockerfile) - the
# kubeconfig it reads is mounted at ~/.kube/config inside it.

[cluster]
localhost ansible_connection=local
