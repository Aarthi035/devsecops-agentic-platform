# Phase 7 - least-privilege workload identities.
#
# By default a Pod runs as the namespace's "default" ServiceAccount and the
# kubelet mounts that account's bearer token into the container. None of the
# three services talks to the Kubernetes API - they serve REST and read their
# own in-memory H2 database - so that token is pure liability: anything with
# code execution inside the container can present it to the API server.
#
# So each service gets its own identity and no token:
#
#   * a dedicated ServiceAccount per service, so the identity is visible in
#     the API audit log and one service can be granted something later without
#     widening the other two;
#   * automountServiceAccountToken: false on the ServiceAccount *and* on each
#     Pod spec (20/21/22-*.yaml) - belt and braces, so neither the account's
#     own default nor a Pod that forgets the flag re-introduces the mount;
#   * no Role and no RoleBinding, so even a token that somehow appears has
#     zero permissions in this namespace. "Nothing" is the entire grant, and
#     that is what least privilege means for a workload that never calls the
#     API.
#
# The agent in Phase 9 is the one workload that *does* need the API. It gets
# its own read-only Role + RoleBinding next to its manifests, not anything
# shared with these three.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: user-service
  namespace: devsecops
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/part-of: devsecops-platform
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: product-service
  namespace: devsecops
  labels:
    app.kubernetes.io/name: product-service
    app.kubernetes.io/part-of: devsecops-platform
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service
  namespace: devsecops
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: devsecops-platform
automountServiceAccountToken: false
