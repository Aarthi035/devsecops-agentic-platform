# order-service: Deployment + ClusterIP Service.
#
# This one calls user-service and product-service over REST. The base URLs come
# from the app-config ConfigMap, so they point at the in-cluster Services rather
# than at localhost. Its readiness probe only passes once Spring Boot is up, and
# the JVM retries downstream calls, so it tolerates the other two starting later.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: devsecops
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: devsecops-platform
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
        app.kubernetes.io/part-of: devsecops-platform
    spec:
      # Phase 7: this service calls the other two over REST, not the Kubernetes
      # API, so it runs under its own ServiceAccount
      # (k8s/rbac/serviceaccounts.yaml) and the kubelet does not mount a token
      # into the container at all.
      serviceAccountName: order-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: order-service
          image: devsecops/order-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-credentials
          resources:
            requests:
              cpu: 100m
              memory: 320Mi
            limits:
              cpu: 500m
              memory: 640Mi
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: devsecops
  labels:
    app.kubernetes.io/name: order-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: order-service
  ports:
    - name: http
      port: 8083
      targetPort: http
      protocol: TCP
