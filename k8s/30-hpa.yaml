# Horizontal Pod Autoscalers.
#
# CPU-based scaling needs metrics-server in the cluster:
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#   kubectl patch deployment metrics-server -n kube-system --type=json \
#     -p '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
#
# maxReplicas is deliberately low (3) so a laptop demo cannot runaway-scale.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user-service
  namespace: devsecops
  labels:
    app.kubernetes.io/part-of: devsecops-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Slow the scale-down so a short CPU spike does not cause flapping.
      stabilizationWindowSeconds: 60
---
