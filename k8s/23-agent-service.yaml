# agent-service: the DevOps Assistant Agent (Phases 8-9).
#
# The agent is the fourth workload in the namespace and the first one that has
# an opinion about the outside world: it reads GitHub, Prometheus, Loki, the API
# server and the Trivy reports. Everything the namespace already enforces still
# applies to it - it runs non-root, with a read-only root filesystem and its own
# ServiceAccount - and the things it needs that the other services do not are
# its own ConfigMap, its own RBAC (k8s/rbac/agent-rbac.yaml) and its own egress
# rules (k8s/network-policies/agent-service-policies.yaml).
#
# Phase 9 is also where the token mount flips on. Phase 7 and 8 left
# automountServiceAccountToken false because nothing called the API server; the
# investigation tools do, so the token is now mounted - against the read-only
# `agent-diagnostics` Role, which grants get/list/watch on Pods, logs, Services,
# ConfigMaps, Events and the apps workload specs, and nothing else.
#
# Deliberately NOT in app-config: the agent shares no configuration with the
# three services, and putting its LLM and GitHub settings next to
# APP_SEED_ENABLED would only make the two harder to read.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-service
  namespace: devsecops
  labels:
    app.kubernetes.io/name: agent-service
    app.kubernetes.io/part-of: devsecops-platform
# Phase 9: the read-only tools call the Kubernetes API, so the token is worth
# mounting now - the Role that makes it so is in k8s/rbac/agent-rbac.yaml, and
# it grants reads and nothing else.
automountServiceAccountToken: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
  namespace: devsecops
  labels:
    app.kubernetes.io/name: agent-service
    app.kubernetes.io/part-of: devsecops-platform
data:
  # "heuristic" is the default and the only provider that works with no extra
  # pod: it answers from the rule table inside the image, which is what lets the
  # deployed agent be exercised without an Ollama instance and is what the
  # Phase 10 evaluation scores against.
  #
  # Set AGENT_LLM_PROVIDER=ollama (and AGENT_LLM_BASE_URL to a reachable Ollama)
  # to have a model write the diagnosis instead. Nothing else changes.
  AGENT_LLM_PROVIDER: "heuristic"
  AGENT_LLM_MODEL: "llama3.2:3b"
  AGENT_LLM_TIMEOUT_SECONDS: "60"
  # "budget", not "max output tokens": the value is a generation limit, not a
  # credential, but a key containing the word TOKEN trips Trivy's KSV-0109
  # ("secrets stored in a ConfigMap"). Neither an inline #trivy:ignore comment
  # nor an entry in .trivyignore.yaml suppresses KSV-0109, so the name that
  # caused a false positive is the thing to change.
  AGENT_LLM_OUTPUT_BUDGET: "700"

  # Commenting is on, but it only happens when GITHUB_TOKEN is present (see the
  # agent-credentials Secret below). With no token the agent still diagnoses and
  # reports why it did not comment.
  AGENT_GITHUB_COMMENT_ENABLED: "true"

  # The guardrails, as environment variables so they can be tuned without
  # rebuilding the image.
  AGENT_MAX_LOG_CHARS: "12000"
  AGENT_MAX_FAILED_JOBS: "3"
  AGENT_GITHUB_TIMEOUT_SECONDS: "30"

  # --- Phase 9: the read-only tools ----------------------------------------
  #
  # "live" talks to the real Prometheus, Loki and API server. "mock" answers
  # from fixtures inside the image and contacts nothing - useful for a demo
  # that must not depend on the monitoring stack being up, and it is what the
  # Phase 10 evaluation runs in. This one switch governs the read-only tools
  # and the action executor together: in mock mode the agent can neither read a
  # cluster nor change one.
  AGENT_TOOLS_MODE: "live"
  AGENT_PROMETHEUS_URL: "http://prometheus.monitoring.svc.cluster.local:9090/prometheus"
  AGENT_LOKI_URL: "http://loki.monitoring.svc.cluster.local:3100"
  AGENT_TOOLS_TIMEOUT_SECONDS: "10"
  AGENT_TOOLS_RETRIES: "1"
  AGENT_TOOLS_MAX_SAMPLES: "20"
  AGENT_TOOLS_MAX_LOG_LINES: "200"

  # The "max steps" guardrail for a Phase 9 investigation, where a step is a
  # tool call. Shared by every alert in one notification rather than granted
  # per alert, so a large alert group cannot multiply it.
  AGENT_MAX_TOOL_CALLS: "12"

  # --- Phase 9: what bounds one alert investigation ------------------------
  AGENT_INCIDENT_DEDUP_WINDOW_SECONDS: "300"
  AGENT_INCIDENT_MAX_ALERTS: "20"
  AGENT_INCIDENT_LOOKBACK_SECONDS: "300"
  AGENT_INCIDENT_NAMESPACE: "devsecops"

  # --- Phase 9: where scanner reports are read from ------------------------
  #
  # report-directory is a boundary, not a default: a requested path is resolved
  # inside it and refused if it escapes (including through a symlink), so
  # POST /analyze-security cannot be used to read an arbitrary file.
  AGENT_SECURITY_REPORT_PATH: "/reports/trivy.json"
  AGENT_SECURITY_REPORT_DIRECTORY: "/reports"
  AGENT_SECURITY_MAX_FINDINGS: "50"
  AGENT_SECURITY_MAX_REPORT_BYTES: "2097152"

  # --- Phase 9: who may authorise a state change ---------------------------
  #
  # The TTL is here; the token is not. AGENT_APPROVAL_TOKEN comes from the
  # agent-credentials Secret below, because it is a credential and a ConfigMap
  # is readable by anything in the namespace. With no token configured the
  # agent still proposes actions, and POST /approve refuses them with a 401.
  AGENT_APPROVAL_TTL_SECONDS: "900"
  AGENT_APPROVAL_MAX_RETAINED: "100"

  # --- Phase 10: where a finished request is traced, and what it cost ------
  #
  # The cluster default is "log": one structured line per request to the
  # 'com.devsecops.agentservice.trace' logger, which Promtail already ships to
  # Loki. Set it to "langfuse" to export instead, and put AGENT_TRACING_PUBLIC_KEY
  # / AGENT_TRACING_SECRET_KEY in the agent-credentials Secret below - with no
  # keys the agent falls back to the log sink rather than failing. "off" silences
  # the export entirely; the Micrometer metrics behind the Grafana agent panel
  # are recorded in every mode.
  #
  # Cost is an estimate, not an invoice: a local Ollama call has none. A
  # deployment on a local model can set both rates to "0" for an honest zero.
  AGENT_TRACING_MODE: "log"
  AGENT_TRACING_HOST: "http://langfuse.monitoring.svc.cluster.local:3000"
  AGENT_TRACING_TIMEOUT_SECONDS: "5"
  AGENT_TRACING_RELEASE: "devsecops-agentic-platform"
  AGENT_TRACING_ENVIRONMENT: "cluster"
  AGENT_TRACING_COST_PER_MODEL_CALL_USD: "0.0002"
  AGENT_TRACING_COST_PER_TOOL_CALL_USD: "0.00002"
---
# Created at deploy time, never committed - same rule as k8s/11-secret.yaml.
#
#   kubectl create secret generic agent-credentials -n devsecops \
#     --from-literal=GITHUB_TOKEN=ghp_... \
#     --from-literal=AGENT_APPROVAL_TOKEN="$(openssl rand -hex 32)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# The token needs the narrowest scope that works: "actions: read" to fetch runs
# and logs, plus "issues: write" (or "pull_requests: write") only if the agent
# should comment. Nothing else - the agent never pushes code or merges.
#
# AGENT_APPROVAL_TOKEN is Phase 9: it is the credential a human presents to
# POST /approve/{actionId}. It is deliberately not optional in spirit - leaving
# it out is a supported configuration in which the agent proposes actions and
# every approval is refused with a 401. Two more keys can live here on a
# deployment that is meant to act or to read private metrics, and their absence
# is also a supported configuration:
#
#   AGENT_EXECUTOR_TOKEN    the write credential. Blank means the agent cannot
#                           change anything, which is the default posture.
#   AGENT_PROMETHEUS_TOKEN  only if Prometheus is behind an authenticating proxy.
apiVersion: v1
kind: Secret
metadata:
  name: agent-credentials
  namespace: devsecops
  labels:
    app.kubernetes.io/name: agent-service
    app.kubernetes.io/part-of: devsecops-platform
type: Opaque
stringData: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
  namespace: devsecops
  labels:
    app.kubernetes.io/name: agent-service
    app.kubernetes.io/part-of: devsecops-platform
spec:
  # No HPA here on purpose: the agent is a low-traffic, bursty webhook consumer,
  # and a laptop that scales it up would scale the JVM heap too.
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-service
        app.kubernetes.io/part-of: devsecops-platform
    spec:
      serviceAccountName: agent-service
      # Phase 9 reads the API server, so the token is mounted here too - belt
      # and braces with the ServiceAccount's own flag, so a Pod that forgets one
      # still gets the other. The read-only Role is what bounds it.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      # A diagnosis in flight holds a log in memory and may be waiting on a model;
      # a SIGKILL mid-analysis loses the answer, so the JVM gets time to finish
      # (Spring's graceful shutdown is configured for 20s in application.yml).
      terminationGracePeriodSeconds: 45
      containers:
        - name: agent-service
          image: devsecops/agent-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8085
          envFrom:
            - configMapRef:
                name: agent-config
            # optional: the agent starts without a token and simply cannot
            # comment, which is the correct behaviour for a dry run.
            - secretRef:
                name: agent-credentials
                optional: true
          env:
            # Named explicitly as well as through the secretRef so the value can
            # never be confused with a ConfigMap key of the same name.
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-credentials
                  key: GITHUB_TOKEN
                  optional: true
            # Phase 9's human gate. Absent is fine: the agent proposes, and the
            # approval endpoint refuses with a 401 until an operator sets it.
            - name: AGENT_APPROVAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-credentials
                  key: AGENT_APPROVAL_TOKEN
                  optional: true
            # Deliberately not read here: AGENT_EXECUTOR_TOKEN must come from the
            # separate agent-executor credential described in
            # k8s/rbac/agent-rbac.yaml, not from this Secret. Mounting the
            # agent's own token as the executor credential would defeat the
            # point of having two identities.
          resources:
            # Bigger than the three services: the request has to cover a JVM plus
            # a truncated job log (12 000 characters by default, but a fetched
            # log can be up to 5 MiB before the sanitiser touches it).
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # Phase 9: scanner reports. Read-only, and a ConfigMap rather than a
            # volume because a Trivy JSON report is a document, not a stateful
            # file. optional: true means the Pod starts without it and
            # POST /analyze-security answers 200 with accepted:false and a
            # diagnosis saying the report was missing - which is the correct
            # answer, not a crash.
            #
            #   kubectl create configmap agent-security-reports -n devsecops \
            #     --from-file=trivy.json=reports/trivy.json
            - name: security-reports
              mountPath: /reports
              readOnly: true
            # NOT mounted by default. Uncomment together with the volume below
            # and set AGENT_EXECUTOR_TOKEN_FILE to enable acting, as described
            # in k8s/rbac/agent-rbac.yaml. Left commented so the checked-in
            # manifest describes a deployment that reads and proposes only.
            #
            # - name: executor-token
            #   mountPath: /var/run/secrets/agent-executor
            #   readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: security-reports
          configMap:
            name: agent-security-reports
            optional: true
        # - name: executor-token
        #   secret:
        #     secretName: agent-executor-token
        #     optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: agent-service
  namespace: devsecops
  labels:
    app.kubernetes.io/name: agent-service
    app.kubernetes.io/part-of: devsecops-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agent-service
  ports:
    - name: http
      port: 8085
      targetPort: http
      protocol: TCP
---
# Its own Ingress rather than a fourth path on devsecops-api: the agent's routes
# are not under /api (the spec fixes /analyze-ci, /alert, /analyze-security and
# /approve), and keeping them in this file means the platform's public API
# surface and the agent's trigger surface stay separately reviewable.
#
# This is how a GitHub Actions job on a self-hosted runner - or curl from the
# laptop - reaches the agent through port 8090.
#
# /approve is the only one of the four that can change anything, and it is
# exposed for the same reason the others are: the demo is a curl. It is not
# unguarded - every request must present the approval token, and without one
# the answer is a 401 - but a deployment that does not want the write path
# reachable from outside the cluster can simply drop that path here and approve
# with an in-cluster curl instead.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devsecops-agent
  namespace: devsecops
  labels:
    app.kubernetes.io/name: agent-service
    app.kubernetes.io/part-of: devsecops-platform
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /analyze-ci
            pathType: Prefix
            backend:
              service:
                name: agent-service
                port:
                  number: 8085
          # Phase 9: the Alertmanager webhook receiver. Alertmanager calls this
          # in-cluster (see monitoring/alertmanager/configmap.yaml); the Ingress
          # path is here so the same endpoint can be exercised by hand.
          - path: /alert
            pathType: Prefix
            backend:
              service:
                name: agent-service
                port:
                  number: 8085
          - path: /analyze-security
            pathType: Prefix
            backend:
              service:
                name: agent-service
                port:
                  number: 8085
          - path: /approve
            pathType: Prefix
            backend:
              service:
                name: agent-service
                port:
                  number: 8085
