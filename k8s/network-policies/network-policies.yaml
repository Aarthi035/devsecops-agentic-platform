# Phase 7 - east-west traffic in the devsecops namespace.
#
# The namespace starts closed ("default-deny-all") and every rule below opens
# exactly one door that something in the platform actually walks through. The
# alternative - leaving it open and blocking known-bad traffic - cannot work,
# because the interesting traffic is the traffic you did not think of.
#
# What actually talks to what, and therefore what is allowed:
#
#   * ingress-nginx  -> the three services   the Ingress is the only way in
#                                            from outside the cluster
#   * Prometheus     -> the three services   /actuator/prometheus scraping
#   * order-service  -> user-service:8081    POST /api/orders fetches the user
#                    -> product-service:8082 then the product
#   * everything     -> kube-dns:53          resolving "user-service" etc.
#
# and nothing else: no service may reach the API server, the internet, the
# monitoring namespace, or each other, beyond the two calls order-service
# makes. Return traffic is not listed anywhere - NetworkPolicy is stateful, so
# a reply to an allowed connection is allowed by default.
#
# Label selectors worth knowing:
#   * "kubernetes.io/metadata.name" is put on every Namespace by the API
#     server since 1.21, so it identifies a namespace without anyone having to
#     label it by hand.
#   * "ports" below are *container* ports (8081/8082/8083), not Service ports.
#     A policy applies to packets hitting the Pod, which is after the Service
#     has already done its port mapping.
#
# One caveat, because it matters and is easy to miss: a NetworkPolicy is only
# a description, and the CNI is what enforces it. kind's default CNI
# (kindnetd) has enforced NetworkPolicy since kind v0.24.0, where it delegates
# to sigs.k8s.io/kube-network-policies - and this repository pins kind
# v0.33.0 in .github/workflows/cd.yml. So these rules are load-bearing in CI,
# and a rule that is merely *plausible* is not good enough: every conversation
# in the list above needs a rule in both directions, because NetworkPolicy is
# not transitive and one policy only ever opens one side. See the Phase 7
# README section for how to check whether the CNI in front of you enforces them.
#
# kubelet traffic is deliberately not mentioned. Health probes come from the
# node, not from a Pod, and how a CNI treats them varies, so a policy that
# tried to allow "just the kubelet" would be guessing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: devsecops
  labels:
    app.kubernetes.io/part-of: devsecops-platform
spec:
  # {} selects every Pod in the namespace, including ones added later.
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  # No ingress: [] and no egress: [] - the absence of rules is the deny.
---
# Without this the closed namespace cannot resolve a single Service name, and
# order-service would fail on "user-service" before it made a request.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: devsecops
  labels:
    app.kubernetes.io/part-of: devsecops-platform
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# The Ingress controller is the only legitimate way in from outside.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-ingress-controller
  namespace: devsecops
  labels:
    app.kubernetes.io/part-of: devsecops-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: devsecops-platform
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8082
        - protocol: TCP
          port: 8083
---
# Prometheus scrapes /actuator/prometheus on every service. It lives in the
# monitoring namespace, so the allow is scoped to that namespace rather than
# to the cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-scrape-from-monitoring
  namespace: devsecops
  labels:
    app.kubernetes.io/part-of: devsecops-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: devsecops-platform
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8082
        - protocol: TCP
          port: 8083
---
# order-service is the only service that calls another one. Both targets are
# inside this namespace, so the two rules are pod-to-pod, not namespace-wide.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-order-service-to-call-others
  namespace: devsecops
  labels:
    app.kubernetes.io/part-of: devsecops-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: order-service
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: user-service
      ports:
        - protocol: TCP
          port: 8081
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: product-service
      ports:
        - protocol: TCP
          port: 8082
---
# The other two thirds of the same conversation.
#
# NetworkPolicy is one-directional: the egress rule above lets order-service's
# packets leave, and these two rules let them arrive. Without them
# default-deny-all still drops the connection on user-service's and
# product-service's side, so order-service fails on "user-service:" with a
# connect timeout while /api/users and /api/products - which arrive from the
# Ingress controller, not from a Pod in this namespace - keep working. That is
# exactly the asymmetry that made the CD smoke test fail on /api/orders alone.
#
# They are one policy per target rather than one policy with a shared
# podSelector, because a NetworkPolicy has a single podSelector and user-service
# listens on 8081 while product-service listens on 8082. Selecting both with
# app.kubernetes.io/part-of would also hand each of them the other's port, which
# is a wider rule than the traffic justifies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-order-service-into-user-service
  namespace: devsecops
  labels:
    app.kubernetes.io/part-of: devsecops-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: user-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: order-service
      ports:
        - protocol: TCP
          port: 8081
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-order-service-into-product-service
  namespace: devsecops
  labels:
    app.kubernetes.io/part-of: devsecops-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: product-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: order-service
      ports:
        - protocol: TCP
          port: 8082
