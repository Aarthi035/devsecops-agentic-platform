# The local datastores are in-memory H2 with the default "sa" account and no
# password, so there is no real secret to ship in this repository. Committing a
# working credential here is exactly what Phase 7 (gitleaks) is meant to catch,
# so the value is deliberately left out and injected at deploy time instead:
#
#   kubectl create secret generic app-credentials -n devsecops \
#     --from-literal=SPRING_DATASOURCE_USERNAME=... \
#     --from-literal=SPRING_DATASOURCE_PASSWORD=... \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# The deployments read this Secret with "envFrom.secretRef", so replacing the
# Secret is all it takes to move from the local defaults to real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: app-credentials
  namespace: devsecops
  labels:
    app.kubernetes.io/part-of: devsecops-platform
type: Opaque
stringData: {}
