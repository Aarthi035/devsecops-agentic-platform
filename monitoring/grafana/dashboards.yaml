# Tells Grafana to load every dashboard JSON it finds under /var/lib/grafana/dashboards.
#
# The JSON is mounted from the grafana-dashboards ConfigMap (see
# ./dashboards/platform-overview.yaml). "folder" puts them in a visible group
# rather than at the root of the dashboard list.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: devsecops-platform
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: platform
        orgId: 1
        folder: Platform
        type: file
        disableDeletion: false
        # Grafana re-reads the directory, so editing the ConfigMap and
        # restarting the Pod (or waiting for the kubelet to sync it) is enough.
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
