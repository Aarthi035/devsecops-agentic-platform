# The Grafana dashboard, shipped as a ConfigMap so that "kubectl apply -R -f
# monitoring/" provisions it with everything else.
#
# WHY THE JSON IS INSIDE THE CONFIGMAP rather than sitting next to it as a
# .json file: a bare .json file in the repository would need a second command
# ("kubectl create configmap --from-file ...") before Grafana could read it, and
# this project's monitoring stack is meant to come up with one apply. The trade
# is that editing the dashboard means editing inside this block.
#
# Every panel keys off metrics the services already publish (Micrometer) plus
# Prometheus's own "up" and "ALERTS" series - see ../prometheus/configmap.yaml
# and ../prometheus/rules/platform-alerts.yaml. Datasources are referenced by
# the uids set in ../datasources.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: devsecops-platform
data:
  platform-overview.json: |
    {
      "uid": "platform-overview",
      "title": "Platform overview",
      "tags": ["devsecops", "phase6"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "editable": true,
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Scrape targets up",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 6 },
          "targets": [
            {
              "refId": "A",
              "instant": true,
              "legendFormat": "{{service}}",
              "expr": "up{job=~\".+-service\"}"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              },
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
              ]
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Firing alerts",
          "description": "ALERTS is published by Prometheus from the rules in monitoring/prometheus/rules.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 6 },
          "targets": [
            {
              "refId": "A",
              "instant": true,
              "legendFormat": "{{alertname}}",
              "expr": "sum by (alertname) (ALERTS{alertstate=\"firing\"})"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Requests / sec",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 6 },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{service}}",
              "expr": "sum by (service) (rate(http_server_requests_seconds_count[5m]))"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "5xx / sec",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "x": 0, "y": 6, "w": 12, "h": 8 },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{service}}",
              "expr": "sum by (service) (rate(http_server_requests_seconds_count{status=~\"5..\"}[5m]))"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "p95 latency",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "x": 12, "y": 6, "w": 12, "h": 8 },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{service}}",
              "expr": "histogram_quantile(0.95, sum by (le, service) (rate(http_server_requests_seconds_bucket[5m])))"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "JVM heap used",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "x": 0, "y": 14, "w": 12, "h": 8 },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{service}}",
              "expr": "sum by (service) (jvm_memory_used_bytes{area=\"heap\"})"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Process CPU",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "x": 12, "y": 14, "w": 12, "h": 8 },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{service}}",
              "expr": "process_cpu_usage{job=~\".+-service\"}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [] }
        },
        {
          "id": 8,
          "type": "logs",
          "title": "Service logs",
          "description": "Shipped by Promtail from /var/log/pods, queried from Loki.",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "x": 0, "y": 22, "w": 24, "h": 8 },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"devsecops\"}"
            }
          ],
          "options": { "showTime": true, "wrapLogMessage": true, "sortOrder": "Descending" }
        }
      ]
    }
