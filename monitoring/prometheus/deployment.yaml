# Prometheus server: one replica, emptyDir storage, serving under /prometheus.
#
# WHY --web.external-url AND NOT AN INGRESS REWRITE
# The Ingress in ../ingress.yaml forwards /prometheus/* unchanged. Prometheus
# derives its own route prefix from the path of external-url, so it serves its
# UI, its API and its assets under /prometheus itself. The alternative -
# rewriting /prometheus/... to /... at the Ingress - breaks the UI, because
# Prometheus builds asset URLs from its route prefix and they would point at
# /static/..., which the Ingress does not route.
#
# --storage.tsdb.retention.time caps the TSDB at six hours. On a laptop with a
# handful of free gigabytes that matters more than history depth.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: devsecops-platform
spec:
  replicas: 1
  strategy:
    # The emptyDir is not shared between Pods, so a surge would give the new
    # Pod an empty TSDB and lose the history the swap was supposed to preserve.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: devsecops-platform
      annotations:
        # Roll the Pod when the scrape config or the rules change: the
        # ConfigMap is mounted as a file, and Prometheus only reads it at
        # startup (or on POST /-/reload).
        checksum/config: "prometheus-config-v3"
        checksum/rules: "prometheus-rules-v2"
    spec:
      securityContext:
        runAsNonRoot: true
        # The official image runs as "nobody"; matching the uid here keeps the
        # emptyDir below writable.
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=6h
            - --web.external-url=http://localhost:8090/prometheus/
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            # Health endpoints move with the route prefix, hence the /prometheus
            # segment.
            httpGet:
              path: /prometheus/-/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /prometheus/-/healthy
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            # Prometheus writes only to /prometheus (the emptyDir) and never
            # needs a writable root filesystem.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: data
          # Deliberately emptyDir (Phase 6 decision): no PVC, no extra disk.
          # Metrics do not survive the Pod being recreated.
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: devsecops-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
      protocol: TCP
