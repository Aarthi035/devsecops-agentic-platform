# Loki (single binary, filesystem storage).
#
# Trimmed deliberately: one process does ingester + querier + compactor, the
# index and chunks live on the emptyDir, and there is no cache or object store
# to run. That is the "few thousand log lines from three services" scale, not
# the "cluster" scale, and it is what keeps the laptop footprint low.
#
# auth_enabled: false is correct here because Loki is only reachable from
# inside the cluster (ClusterIP + the Ingress sub-path), never anonymously
# exposed. Phase 7 adds NetworkPolicies around exactly this.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: devsecops-platform
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: warn

    analytics:
      reporting_enabled: false

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    # v13 + tsdb is the current schema; "from" only has to predate the first
    # log line and must never move backwards on a running instance.
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      # A day of retention matches the emptyDir lifetime (it is gone whenever
      # the Pod is recreated anyway) and caps what a runaway log loop can cost.
      retention_period: 24h
      # The services log a burst of lines at startup; without a ceiling Loki
      # rejects the whole batch and Promtail retries it forever.
      ingestion_rate_mb: 4
      ingestion_burst_size_mb: 8

    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
