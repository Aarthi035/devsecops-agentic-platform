# Alertmanager routing.
#
# Phase 6 wires Prometheus -> Alertmanager and leaves delivery alone: the agent
# webhook that actually consumes these alerts is Phase 9 (POST /alert on
# agent-service, port 8085). A receiver with no integrations is valid
# Alertmanager config - it accepts the notification and records it, which is what
# makes the firing alert visible in the Alertmanager UI. That visibility is what
# Phase 6 verifies.
#
# Phase 9 adds the agent as a webhook receiver, so a firing alert is now both
# visible in the UI and diagnosed automatically. See
# k8s/network-policies/agent-service-policies.yaml for the NetworkPolicy that
# lets this cross the namespace boundary.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: devsecops-platform
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: default
      # One notification per (alert, service) instead of one per alert across
      # every service.
      group_by: ["alertname", "service"]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h

    receivers:
      - name: default
        webhook_configs:
          # The agent's Phase 9 trigger. The name is fully qualified - namespace
          # first, then svc, then the cluster domain - because Alertmanager runs
          # in the monitoring namespace, where the bare "agent-service" does not
          # resolve.
          #
          # send_resolved is on so the agent sees a recovery as well as a
          # failure: a resolved notification is diagnosed too, and simply
          # proposes no action. Without it a resolved alert would be invisible
          # to the agent and its proposed action would sit pending until it
          # expired.
          #
          # Alertmanager re-sends a notification it has not had acknowledged
          # (repeat_interval above, 1h). The agent deduplicates re-sends inside
          # its own window - agent.incident.dedup-window-seconds, 300s - and
          # answers a duplicate from the first investigation rather than
          # investigating again.
          - url: http://agent-service.devsecops.svc.cluster.local:8085/alert
            send_resolved: true
            # Alertmanager's own timeout for the delivery. The agent answers
            # from a rule table in well under this; a model-backed deployment
            # with a slow Ollama is the reason this is generous rather than
            # tight.
            timeout: 30s
