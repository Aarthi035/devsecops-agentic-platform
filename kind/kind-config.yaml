# kind cluster definition for local development.
#
#   kind create cluster --config kind/kind-config.yaml
#
# The port mappings are what make the nginx Ingress reachable from the host:
# the ingress controller binds node port 80, which kind publishes on host 8090.
# "ingress-ready=true" is the node label the ingress-nginx kind manifest expects.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: devsecops
nodes:
  - role: control-plane
    # Pinned node image, set per node: the v1alpha4 Cluster type has no
    # top-level "image" field. kind's default (v1.37.0) never brings the
    # control plane up on this host - it runs cgroup v1, and kubeadm could not
    # even agree on an etcd version for 1.37. Kubernetes 1.33 is the newest
    # line still comfortable with cgroup v1, so pin it here.
    image: kindest/node:v1.33.12
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8090
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
