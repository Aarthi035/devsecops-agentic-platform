name: CI

# Phase 2: build every service on every push/PR, run its tests, keep the
# reports and the runnable jars. No deployment here - that is Phase 4.

on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Least privilege: this workflow only needs to read the repository.
permissions:
  contents: read

# A new push to the same branch cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  MAVEN_ARGS: '-B -ntp'
  REGISTRY: ghcr.io

jobs:
  build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      # Do not stop the other services when one fails - we want the full picture.
      fail-fast: false
      matrix:
        service: [user-service, product-service, order-service, agent-service]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          # Caches ~/.m2/repository, keyed on the service's pom.xml.
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml

      - name: Build and test
        working-directory: services/${{ matrix.service }}
        run: mvn $MAVEN_ARGS verify

      - name: Summarise test results
        if: always()
        working-directory: services/${{ matrix.service }}
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, os, xml.etree.ElementTree as ET

          rows, totals = [], [0, 0, 0, 0]
          for path in sorted(glob.glob("target/surefire-reports/TEST-*.xml")):
              root = ET.parse(path).getroot()
              values = [int(root.get(key, 0)) for key in ("tests", "failures", "errors", "skipped")]
              totals = [a + b for a, b in zip(totals, values)]
              rows.append("| `%s` | %d | %d | %d | %d |" % (root.get("name"), *values))

          print("### %s\n" % os.environ["SERVICE"])
          if rows:
              print("| Test class | Tests | Failures | Errors | Skipped |")
              print("|---|---:|---:|---:|---:|")
              print("\n".join(rows))
              print("\n**Total: %d tests, %d failures, %d errors, %d skipped**" % tuple(totals))
          else:
              print("No test results found.")
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/surefire-reports/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: services/${{ matrix.service }}/target/*.jar
          retention-days: 7
          if-no-files-found: error

  # Phase 3: containerise each service from its own multi-stage Dockerfile.
  # Images are pushed to GHCR only from main and version tags, so a broken
  # commit on a feature branch can still prove the Dockerfile builds.
  docker:
    name: docker (${{ matrix.service }})
    needs: [build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service: [user-service, product-service, order-service, agent-service]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # GHCR image names must be lowercase; the account name is not.
      - name: Compute image name
        run: |
          slug="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=${REGISTRY}/${slug}/${{ matrix.service }}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin

      - name: Build image
        run: |
          docker build \
            --pull \
            --tag "${IMAGE}:sha-${GITHUB_SHA::7}" \
            --tag "${IMAGE}:latest" \
            --file "services/${{ matrix.service }}/Dockerfile" \
            "services/${{ matrix.service }}"

      # Nothing runs as root in the published image - fail the build if it does.
      - name: Assert the image does not run as root
        run: |
          user="$(docker image inspect "${IMAGE}:sha-${GITHUB_SHA::7}" --format '{{.Config.User}}')"
          echo "configured user: '${user}'"
          if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ] || [ "$user" = "0:0" ]; then
            echo "::error::${{ matrix.service }} image would run as root."
            exit 1
          fi

      - name: Push image
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          docker push "${IMAGE}:sha-${GITHUB_SHA::7}"
          docker push "${IMAGE}:latest"

      - name: Summarise image
        run: |
          size="$(docker image inspect "${IMAGE}:sha-${GITHUB_SHA::7}" --format '{{.Size}}')"
          {
            echo "### ${IMAGE}"
            echo
            echo "- tag: \`sha-${GITHUB_SHA::7}\`"
            echo "- size: $((size / 1024 / 1024)) MB"
            echo "- user: \`$(docker image inspect "${IMAGE}:sha-${GITHUB_SHA::7}" --format '{{.Config.User}}')\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Phase 5: the infrastructure is code, so it gets the same treatment as the
  # services. Terraform must be formatted and valid, and the Ansible playbooks
  # must pass a syntax check and the lint profile in ansible/.ansible-lint.
  #
  # Nothing here talks to a cluster: "terraform init -backend=false" installs
  # the providers without configuring a backend, and "validate" only checks the
  # configuration against them. Ansible is run with --syntax-check and
  # ansible-lint, neither of which connects anywhere. cd.yml stays the only
  # workflow that touches a real cluster.
  iac:
    name: IaC (terraform, ansible)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # Pinned to the version the laptop cluster was verified against
          # (terraform version on Windows), so a formatting or validation
          # result means the same thing in both places.
          terraform_version: '1.16.6'
          terraform_wrapper: false

      - name: terraform fmt
        working-directory: terraform
        run: terraform fmt -check -recursive

      # -backend=false: local state is gitignored, and validate does not need it.
      - name: terraform init
        working-directory: terraform
        run: terraform init -backend=false -input=false -no-color

      - name: terraform validate
        working-directory: terraform
        run: terraform validate -no-color

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ansible/requirements.txt

      - name: Install Ansible
        run: |
          pip install --disable-pip-version-check "ansible-core>=2.16,<2.19" -r ansible/requirements.txt
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Ansible syntax check
        working-directory: ansible
        run: |
          ansible-playbook -i inventory/hosts.ini playbooks/site.yml --syntax-check
          ansible-playbook -i inventory/hosts.ini playbooks/verify.yml --syntax-check

      # Reads .ansible-lint (profile: min). The inventory is not needed: lint
      # only parses, it does not run anything.
      - name: Ansible lint
        working-directory: ansible
        run: ansible-lint

  # Phase 6: the monitoring stack is configuration, and configuration is the
  # part of it CI can check without a cluster. Nothing here starts a kind
  # cluster or pulls a monitoring image - that stays cd.yml's job on a machine
  # that has one.
  #
  # .github/scripts/check-monitoring.py parses every manifest under
  # monitoring/ and asserts the invariants the phase depends on, so a manifest
  # that would only fail at apply time fails the build instead: an unpinned
  # image, a container with no requests or limits, a literal password in an env
  # var, a Namespace Terraform already owns, an alert rule with no expression
  # or with a severity nothing routes on. Run it locally with:
  #
  #   python3 .github/scripts/check-monitoring.py
  monitoring:
    name: Monitoring config
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --disable-pip-version-check -r .github/scripts/requirements.txt

      - name: Validate the monitoring manifests
        run: python3 .github/scripts/check-monitoring.py

  # Phase 7: the same treatment for the security posture. Trivy, gitleaks and
  # Dependency-Check run in .github/workflows/security.yml, because they need
  # the network; what runs here is the part of the phase that is a property of
  # the YAML itself.
  #
  # .github/scripts/check-security.py asserts those properties on every
  # manifest under k8s/, so a mistake that would only show up as a Pod that
  # starts with more permission than it needs fails the build instead: a
  # workload on the 'default' account, a mounted token, a Pod without
  # runAsNonRoot, a NetworkPolicy that selects a workload that does not exist,
  # a rule that accidentally allows everything, a RoleBinding that grants one
  # of these service accounts a permission it is supposed to not have.
  #
  # It also checks the two Phase 7 directories are actually reachable:
  # a non-recursive glob over k8s/ is exactly the mistake that left
  # k8s/rbac/ and k8s/network-policies/ unapplied. Run it locally with:
  #
  #   python3 .github/scripts/check-security.py
  security:
    name: Security config
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --disable-pip-version-check -r .github/scripts/requirements.txt

      - name: Validate the RBAC and NetworkPolicy manifests
        run: python3 .github/scripts/check-security.py

  # Phase 10: exercise the agent over HTTP against a local GitHub API stub.
  # The heuristic provider keeps this deterministic and needs no secret,
  # Ollama model or Kubernetes cluster.
  evals:
    name: Agent evaluations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: services/agent-service/pom.xml

      - name: Build the agent
        working-directory: services/agent-service
        run: mvn $MAVEN_ARGS package -DskipTests

      - name: Start the heuristic agent
        working-directory: services/agent-service
        env:
          AGENT_LLM_PROVIDER: heuristic
          AGENT_GITHUB_API_URL: http://127.0.0.1:8765
          AGENT_GITHUB_COMMENT_ENABLED: 'false'
        run: |
          java -jar target/agent-service-1.0.0.jar > /tmp/agent-service.log 2>&1 &
          echo $! > /tmp/agent-service.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8085/actuator/health; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/agent-service.log
          exit 1

      - name: Run the 12 deterministic scenarios
        run: python3 evals/run_evals.py --agent-url http://127.0.0.1:8085 --mock-port 8765

      - name: Show agent log on failure
        if: failure()
        run: cat /tmp/agent-service.log

      - name: Stop the agent
        if: always()
        run: kill "$(cat /tmp/agent-service.pid)" 2>/dev/null || true

  # Single check to require in branch protection: it fails if any matrix leg failed.
  ci-status:
    name: CI status
    if: always()
    needs: [build, docker, iac, monitoring, security, evals]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        run: |
          echo "build matrix result: ${{ needs.build.result }}"
          echo "docker matrix result: ${{ needs.docker.result }}"
          echo "iac result: ${{ needs.iac.result }}"
          echo "monitoring result: ${{ needs.monitoring.result }}"
          echo "security result: ${{ needs.security.result }}"
          echo "evals result: ${{ needs.evals.result }}"
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::One or more service builds did not succeed."
            exit 1
          fi
          # The docker job is skipped on pull requests, which is not a failure.
          if [ "${{ needs.docker.result }}" != "success" ] && [ "${{ needs.docker.result }}" != "skipped" ]; then
            echo "::error::One or more images did not build."
            exit 1
          fi
          if [ "${{ needs.iac.result }}" != "success" ]; then
            echo "::error::The Terraform or Ansible checks did not succeed."
            exit 1
          fi
          if [ "${{ needs.monitoring.result }}" != "success" ]; then
            echo "::error::The monitoring configuration checks did not succeed."
            exit 1
          fi
          if [ "${{ needs.security.result }}" != "success" ]; then
            echo "::error::The RBAC or NetworkPolicy checks did not succeed."
            exit 1
          fi
          if [ "${{ needs.evals.result }}" != "success" ]; then
            echo "::error::The agent evaluation suite did not succeed."
            exit 1
          fi
