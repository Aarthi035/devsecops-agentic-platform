name: CD

# Continuous deployment.
#
# CI publishes the images to GHCR. This workflow picks up a successful CI run on
# main, stands up a throwaway kind cluster, loads the images published for that
# exact commit into it, applies the manifests in k8s/, and smoke-tests the
# result through the Ingress. If the smoke test fails, every Deployment is
# rolled back - that is the rollback step the project spec asks for.
#
# Images are addressed by the immutable "sha-<commit>" tag CI pushes, never by
# "latest": the deployment is reproducible, and "kubectl get deployment -o
# jsonpath=..." states which commit is running.
#
# It runs on GitHub's runners rather than the laptop because a runner can create
# its own kind cluster, so the whole deploy is reproducible without a tunnel
# back to the local machine. The laptop equivalent of these steps is documented
# in the README under "Phase 4 - Kubernetes".
#
# NOTE: rolling back only helps from the second deployment onwards. The very
# first deploy has a single revision, so "rollout undo" is a no-op there and
# the diagnostics dump below is what tells you what went wrong.

on:
  # Run after CI completes. The job's "if" below then keeps only a successful
  # CI run of main, which is the only place ci.yml publishes the sha-<commit>
  # images this workflow deploys.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # Allow a manual re-deploy of the current ref.
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  CLUSTER_NAME: devsecops
  NAMESPACE: devsecops
  KIND_VERSION: v0.33.0
  INGRESS_NGINX_VERSION: controller-v1.11.3
  # The commit this deploy must run. Under "workflow_run" the context is the
  # default branch, so the revision has to come from the event payload; a manual
  # dispatch deploys whatever the dispatched ref points at.
  TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # Deploy a CI run that actually succeeded on the default branch: ci.yml only
    # pushes the sha-<commit> tags from main and v* tags, so deploying a dev or
    # feature run would ask GHCR for an image that was never published.
    # A manual dispatch always runs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    # Pinned rather than ubuntu-latest: the label is migrating to Ubuntu 26 and
    # the tool versions on the image (kubectl in particular) change with it.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout the revision CI validated
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Install kind
        # Download to /tmp, not ./kind: the repository already has a kind/
        # directory and curl refuses to write a file over it.
        run: |
          curl -fsSLo /tmp/kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          kind version

      - name: Create kind cluster
        # Pinned to kindest/node:v1.33.12 and published on host port 8090 by
        # kind/kind-config.yaml, exactly like the laptop cluster.
        run: kind create cluster --config kind/kind-config.yaml

      - name: Install ingress-nginx
        run: |
          kubectl apply -f "https://raw.githubusercontent.com/kubernetes/ingress-nginx/${INGRESS_NGINX_VERSION}/deploy/static/provider/kind/deploy.yaml"
          # Wait on the Deployment, not on a Pod label selector. "kubectl wait"
          # fails immediately with "no matching resources found" when nothing
          # matches yet, and the controller's Pods do not exist in the seconds
          # right after the apply. The Deployment object does exist by then, so
          # waiting on its Available condition is race-free.
          kubectl wait --namespace ingress-nginx \
            --for=condition=available deployment/ingress-nginx-controller \
            --timeout=300s

      - name: Install metrics-server
        # metrics-server refuses to talk to kind's self-signed kubelet certificate
        # unless it is told to skip verification. Without this the HPA never
        # leaves "cpu: <unknown>".
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          kubectl patch deployment metrics-server -n kube-system --type=json \
            -p '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          kubectl wait --namespace kube-system --for=condition=available deployment/metrics-server --timeout=240s

      - name: Pull the published images and load them into the cluster
        env:
          REPOSITORY_SLUG: ${{ github.repository }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # ci.yml pushes to <registry>/<lowercased repository>/<service>, so the
          # repository name is part of the path - "ghcr.io/<owner>/<service>" is a
          # different (empty) package and pulls fail with "manifest unknown".
          PREFIX="${REGISTRY}/$(echo "${REPOSITORY_SLUG}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_TAG="sha-$(echo "${TARGET_SHA}" | cut -c1-7)"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "Deploying commit ${TARGET_SHA} (${IMAGE_TAG})" >> "$GITHUB_STEP_SUMMARY"
          echo "${GHCR_TOKEN}" | docker login "${REGISTRY}" -u "${GHCR_USER}" --password-stdin
          for svc in user-service product-service order-service; do
            docker pull "${PREFIX}/${svc}:${IMAGE_TAG}"
            # Two tags per service: the immutable one identifies the commit the
            # Deployment runs, the manifest's own 1.0.0 tag is loaded as well so
            # the "kubectl apply -R -f k8s/" below never leaves a container
            # waiting on an image that is not on the node.
            docker tag "${PREFIX}/${svc}:${IMAGE_TAG}" "devsecops/${svc}:${IMAGE_TAG}"
            docker tag "${PREFIX}/${svc}:${IMAGE_TAG}" "devsecops/${svc}:1.0.0"
            kind load docker-image --name "${CLUSTER_NAME}" \
              "devsecops/${svc}:${IMAGE_TAG}" "devsecops/${svc}:1.0.0"
          done

      - name: Apply Kubernetes manifests
        run: |
          # -R (recursive) is required from Phase 7 onwards: k8s/rbac/ and
          # k8s/network-policies/ are subdirectories, and a plain "-f k8s/"
          # silently skips them. That is how the ServiceAccounts and the
          # default-deny NetworkPolicy could sit in the repository, look
          # correct, and never be applied to a cluster.
          kubectl apply -R -f k8s/
          # Pin every Deployment to the commit's tag. Applying the manifests
          # alone would leave them on the fixed 1.0.0 tag, which hides which
          # revision is live and makes a rolling update a no-op.
          for svc in user-service product-service order-service; do
            kubectl set image "deployment/${svc}" "${svc}=devsecops/${svc}:${IMAGE_TAG}" -n "${NAMESPACE}"
          done

      - name: Wait for rollout
        run: |
          kubectl wait --for=condition=available deployment --all -n "${NAMESPACE}" --timeout=300s
          kubectl get pods -n "${NAMESPACE}"
          for svc in user-service product-service order-service; do
            echo "${svc}: $(kubectl get deployment "${svc}" -n "${NAMESPACE}" -o jsonpath='{.spec.template.spec.containers[0].image}')"
          done

      - name: Smoke test through the Ingress
        run: |
          set -euo pipefail
          # Every call is retried, not just the first one: right after a rollout
          # the Ingress can answer 502 for a moment while the new pod's endpoint
          # propagates, and a single late call would otherwise trigger a
          # rollback of an otherwise healthy deploy.
          check() {
            local url="$1"
            shift
            for i in $(seq 1 12); do
              if curl -sf "$@" "${url}" > /tmp/smoke.out; then
                echo "${url} -> ok (attempt ${i})"
                return 0
              fi
              echo "attempt ${i}: ${url} not ready yet"
              sleep 5
            done
            echo "::error::${url} never became healthy"
            return 1
          }

          check http://localhost:8090/api/users
          grep -q "aarthi@example.com" /tmp/smoke.out

          check http://localhost:8090/api/products

          check http://localhost:8090/api/orders \
            -X POST \
            -H 'Content-Type: application/json' \
            -d '{"userId":1,"productId":1,"quantity":2}'
          cat /tmp/smoke.out
          grep -q '"status":"CREATED"' /tmp/smoke.out

      - name: Report cluster state
        if: always()
        run: |
          kubectl get pods,hpa,ingress -n "${NAMESPACE}" || true

      - name: Roll back on failure
        if: failure()
        run: |
          echo "Deployment failed - rolling back every Deployment in ${NAMESPACE}"
          for d in $(kubectl get deployment -n "${NAMESPACE}" -o name); do
            kubectl rollout undo "${d}" -n "${NAMESPACE}" || true
          done
          kubectl wait --for=condition=available deployment --all -n "${NAMESPACE}" --timeout=180s || true
          echo "--- diagnostics ---"
          kubectl describe pods -n "${NAMESPACE}" | tail -n 80 || true
